name: Mobile app

on:
  push:
    paths: ['mobileapp/**', '.github/workflows/mobileapp.yml']
  pull_request:
    paths: ['mobileapp/**', '.github/workflows/mobileapp.yml']

permissions:
  contents: read

concurrency:
  group: mobileapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobileapp
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v4
      # Tests run on the JVM (Robolectric); CI never calls the real API.
      - run: ./gradlew spotlessCheck :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobileapp-reports
          path: mobileapp/app/build/reports
